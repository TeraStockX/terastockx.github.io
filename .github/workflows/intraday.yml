# Intraday update: every 10 minutes from 11:00 to 23:59 UTC on weekdays (7:00/6:00 to 19:59/18:59 New York
# time: pre-market, trading hours and the evening, when most companies publish their results).
# - prices and market caps (stocks and ETFs; Nasdaq, delayed about 15 minutes)
# - companies that filed an annual or quarterly report since the daily update are downloaded again from the
#   SEC (new figures and TeraScore); those that filed a current report (8-K, 6-K) get their events refreshed
# - the index, the market summary and the search pages are rebuilt and published
# Nothing is saved to the data branch (the daily run does the full update); companies refreshed during the
# day are carried from run to run in the Actions cache. GitHub may start scheduled runs a few minutes late.
name: Napközbeni frissítés

on:
  schedule:
    - cron: "*/10 11-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Adatok betöltése (data ág)
        run: |
          git fetch -q --depth=1 origin data
          rm -rf data
          git archive FETCH_HEAD data | tar -x
      - name: Napközben már frissített cégek (előző futásokból)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/overlay
          key: intraday-${{ github.run_id }}
          restore-keys: intraday-
      - id: pages
        uses: actions/configure-pages@v5
      - name: Új jelentések, árfolyamok, index, piaci összefoglaló
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          INTRADAY_OVERLAY: ${{ runner.temp }}/overlay
        run: node scripts/update-data.mjs --quotes-only
      - name: Frissített cégek megőrzése a következő futáshoz
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/overlay
          key: intraday-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
