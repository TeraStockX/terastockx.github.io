# Intraday update (times in UTC), a chain of runs that never stops:
# - every 5 minutes from 13:00 to 21:59 on weekdays, which covers the US trading session in summer and
#   winter (9:30–16:00 New York time = 13:30–20:00 / 14:30–21:00 UTC)
# - every 10 minutes from 11:00 to 12:59 and from 22:00 to 00:59, before and after the session, when most
#   companies publish their results and file their reports; every 30 minutes from 8:00 (pre-market)
# - every hour at night and at the weekend, so new filings still arrive and the morning does not wait for
#   GitHub's schedule
# GitHub starts scheduled runs late or skips them when it is busy (some days for hours), so each run starts
# the next one itself (the "next" job, at the end); the schedule below only starts the chain again if it ever
# stops. While the daily update is running, a run skips its update (the daily one publishes the newest data).
# Each run:
# - prices and market caps (stocks and ETFs; Nasdaq, delayed about 15 minutes), so the price-dependent parts
#   of every TeraScore (valuation) follow the market
# - companies that filed an annual or quarterly report since their data was downloaded are downloaded again
#   from the SEC (new figures and TeraScore); those that filed a current report (8-K, 6-K) get their events
#   and news refreshed
# - the index, the market summary with the top stories and the search pages are rebuilt and published
# Nothing is saved to the data branch (the daily run does the full update); companies refreshed during the
# day are carried from run to run in the Actions cache. The runs have their own concurrency group, so they
# never cancel a waiting run of the daily update; two deployments at the same moment are handled by the
# retry of the deploy job.
name: Napközbeni frissítés

on:
  schedule:
    - cron: "7-59/15 11-23 * * 1-5"
    - cron: "7-59/15 0 * * 2-6"
    # Backup starts at night and at the weekend (the chain itself runs hourly then).
    - cron: "37 1-10 * * *"
    - cron: "37 11-23 * * 0,6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      skip: ${{ steps.busy.outputs.skip }}
    steps:
      # While the daily update runs (not a code change: that only rebuilds the index), this run leaves the
      # update to it (it publishes the newest data).
      - id: busy
        name: Fut a napi frissítés?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 5 --json status,event -q '[.[] | select(.status != "completed" and .event != "push")] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then echo "The daily update is running: this run is skipped, the chain goes on."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.busy.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.busy.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Adatok betöltése (data ág)
        if: steps.busy.outputs.skip != 'true'
        run: |
          git fetch -q --depth=1 origin data
          rm -rf data
          git archive FETCH_HEAD data | tar -x
      - name: Napközben már frissített cégek (előző futásokból)
        if: steps.busy.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/overlay
          key: intraday-${{ github.run_id }}
          restore-keys: intraday-
      - id: pages
        if: steps.busy.outputs.skip != 'true'
        uses: actions/configure-pages@v5
      - name: Új jelentések, árfolyamok, index, piaci összefoglaló
        if: steps.busy.outputs.skip != 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          INTRADAY_OVERLAY: ${{ runner.temp }}/overlay
        run: node scripts/update-data.mjs --quotes-only
      - name: Frissített cégek megőrzése a következő futáshoz
        if: always() && steps.busy.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/overlay
          key: intraday-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.busy.outputs.skip != 'true'
        with:
          path: .

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub may still be finishing the previous deployment for a short while: wait, then try once more.
      - name: Várakozás az előző közzététel befejezésére
        if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # Starts the next run: 5 minutes after this run's start during the US session, 10 minutes before and after
  # it, 30 minutes in the early morning, an hour at night and at the weekend. If another run is already
  # waiting, that one continues the chain.
  next:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
    steps:
      - name: Következő futás indítása
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dow=$(date -u +%u); h=$((10#$(date -u +%H)))
          step=3600
          if [ "$dow" -le 5 ] && [ "$h" -ge 8 ] && [ "$h" -lt 11 ]; then step=1800; fi
          if { [ "$dow" -le 5 ] && [ "$h" -ge 11 ]; } || { [ "$dow" -ge 2 ] && [ "$dow" -le 6 ] && [ "$h" -lt 1 ]; }; then step=600; fi
          if [ "$dow" -le 5 ] && [ "$h" -ge 13 ] && [ "$h" -le 21 ]; then step=300; fi
          # A short GitHub API hiccup must not break the chain: every call is tried 3 times.
          retry() { for i in 1 2 3; do if "$@"; then return 0; fi; sleep 15; done; return 1; }
          created=$(retry gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt -q .createdAt || true)
          wait=$(( $(date -d "${created:-now}" +%s) + step - $(date +%s) ))
          if [ "$wait" -gt 0 ] && [ "$wait" -le "$step" ]; then echo "Waiting ${wait}s"; sleep "$wait"; fi
          # Unknown? Start the next run anyway: of two waiting runs GitHub keeps one (concurrency group).
          others=$(retry gh run list --repo "$GITHUB_REPOSITORY" --workflow intraday.yml --limit 20 --json databaseId,status -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length" || echo 0)
          if [ "${others:-0}" -gt 0 ]; then echo "Another run is already waiting; it continues the chain."; exit 0; fi
          if retry gh workflow run intraday.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"; then
            echo "Next run started."
          else
            echo "::warning::The next run could not be started; the schedule starts the chain again."
          fi
