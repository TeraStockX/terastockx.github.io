name: diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch as Googlebot
        run: |
          UA='Mozilla/5.0 (compatible; Googlebot/2.1)'
          for u in sitemap.xml robots.txt c/AAPL/; do
            echo "== /$u"
            curl -s -A "$UA" -o body.txt -D headers.txt "https://terastockx.github.io/$u"
            grep -iE '^HTTP|content-type|content-length' headers.txt
            echo "bytes $(wc -c < body.txt)"
          done
          curl -s -A "$UA" -o sm.xml https://terastockx.github.io/sitemap.xml
          python3 -c 'import xml.etree.ElementTree as E; r=E.parse("sm.xml").getroot(); print("parsed OK urls", len(r))'
