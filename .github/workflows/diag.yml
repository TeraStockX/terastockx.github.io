name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build logs of the night runs and extended-hours quotes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          repo=TeraStockX/terastockx.github.io
          f=out/night2.txt
          echo "now $(date -u +%FT%TZ)" > $f
          # The night's runs: the evening (post session), after 20:00 New York time, and the latest.
          for run in $(gh run list --repo $repo --workflow intraday.yml --limit 40 --json databaseId,createdAt,status -q '.[] | select(.createdAt >= "2026-11-24T23:50:00Z" and .status == "completed") | .databaseId' | head -12) 45543732778; do
            echo "=== run $run" >> $f
            gh run view $run --repo $repo --log > job.log 2> err.log || true
            [ -s job.log ] || { echo "no log: $(head -c 300 err.log)" >> $f; jobs=$(gh run view $run --repo $repo --json jobs -q '.jobs[] | select(.name=="build") | .databaseId'); for j in $jobs; do gh run view --repo $repo --job $j --log > job.log 2> err.log || echo "no job log: $(head -c 300 err.log)" >> $f; done; }
            grep -E "new filings|refreshed:|quotes updated|top stories|rror|arning|ailed" job.log | grep -vE "Node.js 20|punycode|DEP0|trace-deprecation|\./data/|\./assets/|\./scripts/|\./tests/|^next|##\[group\]|\[36;1m" | sed -E 's/^([a-z]+)\t[^\t]*\t/\1 /' | cut -c1-420 | head -12 >> $f
          done
          echo "=== live extended-hours quotes" >> $f
          node extcheck.mjs >> $f 2>&1 || echo "extcheck failed" >> $f
          cat $f
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: night logs and extended-hours quotes" && git push -q origin HEAD:diag
