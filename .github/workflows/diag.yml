name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - name: Wait for the new verification tag on the live site
        run: |
          mkdir -p out
          {
          for i in $(seq 1 40); do
            if curl -s -m 20 "https://terastockx.com/?v=$i" | grep -q "MDZrUFpeJQXSUMlr4h6268PUKnTNOR1d1VHMrgMlnb0"; then echo "found after try $i ($(date -u +%H:%M:%S))"; break; fi
            sleep 15
          done
          echo "--- tags on https://terastockx.com/"
          curl -s -m 20 https://terastockx.com/ | grep -o '<meta name="google-site-verification"[^>]*>'
          echo "--- tags on https://terastockx.com/c/AAPL/"
          curl -s -m 20 https://terastockx.com/c/AAPL/ | grep -o '<meta name="google-site-verification"[^>]*>'
          echo "--- http -> $(curl -s -o /dev/null -m 20 -w '%{http_code} %{redirect_url}' http://terastockx.com/)"
          } 2>&1 | tee out/verify.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: verification tag results" && git push -q origin HEAD:diag
