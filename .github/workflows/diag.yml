name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ETF prices after the fix (three intraday runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          seen=""
          for round in 1 2 3; do
            for i in $(seq 1 45); do
              id=$(gh run list --repo TeraStockX/terastockx.github.io --workflow intraday.yml --limit 15 --json databaseId,headSha,status -q '[.[] | select(.headSha | startswith("af951e12")) | select(.status == "completed")] | map(.databaseId) | join(" ")')
              n=$(echo "$id" | wc -w)
              if [ "$n" -ge "$round" ]; then break; fi
              sleep 20
            done
            last=$(echo "$id" | awk '{print $1}')
            echo "--- round $round, run $last" | tee -a out/etf2.txt
            gh run view $last --repo TeraStockX/terastockx.github.io --log 2>&1 | grep -E "quotes updated|ETF prices|rror" | grep -v "Node.js 20" | sed -E 's/^([a-z]+)\t[^\t]*\t/\1 /' | cut -c1-300 | tee -a out/etf2.txt
            sleep 40
            node etfcheck.mjs 2>&1 | tee -a out/etf2.txt
          done
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: ETF prices after the fix" && git push -q origin HEAD:diag
