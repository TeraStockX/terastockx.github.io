name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - name: Wait for an intraday run of the new code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          for i in $(seq 1 60); do
            id=$(gh run list --repo TeraStockX/terastockx.github.io --workflow intraday.yml --limit 10 --json databaseId,headSha,status -q '[.[] | select(.headSha | startswith("f3bef211")) | select(.status == "completed")][0].databaseId')
            if [ -n "$id" ]; then echo "run $id"; echo "$id" > out/run-id; break; fi
            sleep 20
          done
          id=$(cat out/run-id 2>/dev/null || true)
          {
          echo "now $(date -u +%FT%TZ) run $id"
          [ -n "$id" ] && gh run view $id --repo TeraStockX/terastockx.github.io --log 2>&1 | grep -E "new filings|refreshed:|news of large|quotes updated|pre-market|after-hours|news:|Error|error" | grep -v "Node.js 20" | sed -E 's/^([a-z]+)\t[^\t]*\t/\1 /' | cut -c1-260 | head -20
          sleep 60
          curl -sL "https://terastockx.com/data/pulse.json?x=$(date +%s)" -o pulse.json
          node -e 'const p=require("./pulse.json"); console.log("pulse", p.generated, "session", p.session, p.prevDay); for (const s of p.stories||[]) console.log(" ", s.t, s.kind, s.move, s.when, (s.title||"").slice(0,90));'
          curl -sL "https://terastockx.com/data/companies/NVDA.json?x=$(date +%s)" -o nvda.json
          node -e 'const c=require("./nvda.json"); console.log("NVDA newsChecked", c.newsChecked, "news", JSON.stringify((c.news||[]).map(n=>[n.date,n.kind,n.title])), "events", JSON.stringify((c.events||[]).slice(0,3).map(e=>[e.date,e.items,e.title])), "ext", JSON.stringify(c.market?.ext));'
          } 2>&1 | tee out/stories.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Live screenshots
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node live.cjs 2>&1 | tee out/stories-shots.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: top stories live check" && git push -q origin HEAD:diag
