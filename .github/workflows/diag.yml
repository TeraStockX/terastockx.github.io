name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Nasdaq dividend history
        run: |
          mkdir -p out
          node probe4.mjs > out/probe4.txt 2>&1 || echo "probe4 failed" >> out/probe4.txt
          cat out/probe4.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: Nasdaq dividend history" && git push -q origin HEAD:diag
