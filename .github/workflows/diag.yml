name: diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 30); do
            if curl -s "https://terastockx.github.io/?v=$i$RANDOM" | grep -q 'EuGE1ZDX92aqQsSlnA3NPL17MJ9lwHeAidkUWhawreg'; then echo "VERIFICATION TAG LIVE after $((i*20))s"; break; fi
            sleep 20
          done
          curl -s https://terastockx.github.io/ | grep -o '<meta name="google-site-verification"[^>]*>' || echo "TAG NOT FOUND"
          curl -s -o /dev/null -w "sitemap %{http_code}\n" https://terastockx.github.io/sitemap.xml
