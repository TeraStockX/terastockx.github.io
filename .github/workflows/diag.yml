name: diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: DNS and HTTP check
        run: |
          for srv in 1.1.1.1 8.8.8.8; do
            echo "== resolver $srv"
            echo "A:     $(dig +short A terastockx.com @$srv | tr '\n' ' ')"
            echo "AAAA:  $(dig +short AAAA terastockx.com @$srv | tr '\n' ' ')"
            echo "www:   $(dig +short CNAME www.terastockx.com @$srv | tr '\n' ' ') / $(dig +short A www.terastockx.com @$srv | tr '\n' ' ')"
            echo "MX:    $(dig +short MX terastockx.com @$srv | tr '\n' ' ')"
          done
          echo "NS:    $(dig +short NS terastockx.com | tr '\n' ' ')"
          echo "authoritative A: $(dig +short A terastockx.com @$(dig +short NS terastockx.com | head -1) | tr '\n' ' ')"
          echo "== http://terastockx.com"
          curl -s -o /dev/null -m 15 -w "%{http_code} %{redirect_url}\n" http://terastockx.com/ || true
          curl -s -m 15 -I http://terastockx.com/ | grep -iE "^server|^location" || true
