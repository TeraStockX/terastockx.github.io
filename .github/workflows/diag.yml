name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Wait for the deploy of a597a433
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          for i in $(seq 1 60); do
            st=$(gh run view 45466667825 --repo TeraStockX/terastockx.github.io --json status,conclusion -q '.status + " " + .conclusion')
            case "$st" in completed*) break;; esac
            sleep 15
          done
          echo "deploy: $st" | tee out/livepf.txt
          sleep 60
      - name: Live portfolio screenshots
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node livepf.cjs 2>&1 | tee -a out/livepf.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: live portfolio check" && git push -q origin HEAD:diag
