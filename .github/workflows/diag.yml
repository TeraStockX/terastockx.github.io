name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Explore news sources
        env:
          SEC_UA: ${{ secrets.SEC_USER_AGENT }}
        run: |
          mkdir -p out
          node explore.mjs > /dev/null 2>&1 || echo "explore failed: $?"
          ls -la out
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: news source results" && git push -q origin HEAD:diag
