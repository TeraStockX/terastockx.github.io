name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Wait for the deploy of c1399962
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          repo=TeraStockX/terastockx.github.io
          for i in $(seq 1 60); do
            id=$(gh run list --repo $repo --workflow deploy.yml --limit 5 --json databaseId,headSha,status -q '[.[] | select(.headSha | startswith("c1399962"))][0].databaseId')
            st=$(gh run view $id --repo $repo --json status,conclusion -q '.status + " " + .conclusion' 2>/dev/null)
            case "$st" in completed*) break;; esac
            sleep 15
          done
          { echo "deploy $id: $st"; gh run view $id --repo $repo --log 2>&1 | grep -E "Data of intraday run|Data loaded from|rror" | grep -v "Node.js 20" | sed -E 's/^([a-z]+)\t[^\t]*\t/\1 /' | cut -c1-220 | head -10; } | tee out/deployfix.txt
          sleep 45
      - name: Live portfolio right after the deploy
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          curl -sL "https://terastockx.com/data/etfs.json?x=$(date +%s)" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const e=JSON.parse(s);console.log("live etfs quotesAt",e.quotesAt,JSON.stringify(e.etfs.find(x=>x.t==="SPY")))})' | tee -a out/deployfix.txt
          node livepf.cjs 2>&1 | grep pf-hu-phone-1d | cut -c1-700 | tee -a out/deployfix.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: deploy fix check" && git push -q origin HEAD:diag
