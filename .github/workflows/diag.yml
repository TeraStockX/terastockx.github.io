name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Back-reference headlines and market-info
        run: |
          mkdir -p out datab
          git fetch -q --depth=1 origin data
          git archive FETCH_HEAD data/companies | tar -x -C datab
          node hlcheck.mjs > out/hl.txt 2>&1 || echo "hlcheck failed" >> out/hl.txt
          cat out/hl.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: back-reference headlines" && git push -q origin HEAD:diag
