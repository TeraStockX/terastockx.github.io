name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Daily closes pipeline and the last daily run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          node pipecheck.mjs 2>&1 | tee out/pipe.txt
          echo "--- daily run 45332971134" | tee -a out/pipe.txt
          gh run view 45332971134 --repo TeraStockX/terastockx.github.io --log 2>&1 | grep -E "price histor|ETF price|European ETFs|budget|companies updated|weekly|snapshot" | sed -E 's/^([a-z]+)\t[^\t]*\t/\1 /' | cut -c1-260 | tail -40 | tee -a out/pipe.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: daily closes pipeline check" && git push -q origin HEAD:diag
