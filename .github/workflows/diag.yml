name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy and AI-worker runs of f1d15261, then the live site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          repo=TeraStockX/terastockx.github.io
          for id in 45494235077 45494235055; do
            for i in $(seq 1 60); do
              st=$(gh run view $id --repo $repo --json status,conclusion,name -q '.name + ": " + .status + " " + .conclusion' 2>/dev/null)
              case "$st" in *completed*) break;; esac
              sleep 15
            done
            echo "$st" | tee -a out/ai.txt
          done
          gh run view 45494235055 --repo $repo --log 2>&1 | grep -E "notice|not set up|rror" | grep -v "Node.js 20" | sed -E 's/^([a-z]+)\t[^\t]*\t/\1 /' | cut -c1-220 | head -5 | tee -a out/ai.txt
          sleep 40
          npm install --no-save --no-audit --no-fund playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node liveai.cjs 2>&1 | tee -a out/ai.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: AI helper deploy check" && git push -q origin HEAD:diag
