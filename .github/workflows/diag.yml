name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tag survey (capex, debt)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node tagsurvey.mjs | tee out/tagsurvey.txt
      - name: Save results to the diag branch
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: tag survey results" && git push -q origin HEAD:diag
