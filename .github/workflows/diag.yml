name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Phase timings of the daily run; candidate predecessors of BIP and VRSA
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          mkdir -p out
          ./timing.sh > out/timing.txt 2>&1 || echo "timing failed" >> out/timing.txt
          node probe3.mjs > out/probe3.txt 2>&1 || echo "probe3 failed" >> out/probe3.txt
          cat out/timing.txt out/probe3.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: phase timings and BIP/VRSA predecessors" && git push -q origin HEAD:diag
