name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - name: Run summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          {
          echo "=== daily 45118568408"
          gh run view 45118568408 --repo TeraStockX/terastockx.github.io --log 2>&1 | grep -E "logos:|Done:|ERROR|insider|price histories|removed|ETF|data/index.json|search pages|fx|error" | grep -v "Node.js 20" | cut -c1-260 | head -30
          for r in 45169195822 45181891161; do
            echo "=== intraday $r"
            gh run view $r --repo TeraStockX/terastockx.github.io --log 2>&1 | grep -E "new filings|refreshed:|quotes updated|Cache restored|Cache saved|cache|ERROR" | grep -v "Node.js 20" | cut -c1-260 | head -12
          done
          echo "=== intraday schedule history"
          gh run list --repo TeraStockX/terastockx.github.io --workflow intraday.yml --limit 20 --json createdAt,event,status,conclusion -q '.[] | "\(.createdAt) \(.event) \(.status) \(.conclusion)"'
          } 2>&1 | tee out/runs.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: run summaries" && git push -q origin HEAD:diag
