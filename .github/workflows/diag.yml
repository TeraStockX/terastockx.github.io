name: diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Site check on the custom domain
        run: |
          for u in https://terastockx.com/ https://www.terastockx.com/ http://terastockx.com/ https://terastockx.github.io/ https://terastockx.com/c/AAPL/ https://terastockx.com/sitemap.xml https://terastockx.com/data/index.json; do
            echo "$u -> $(curl -s -o /dev/null -m 20 -w '%{http_code} %{redirect_url} ssl_verify=%{ssl_verify_result}' "$u" 2>&1)"
          done
          echo "cert: $(echo | openssl s_client -connect terastockx.com:443 -servername terastockx.com 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>/dev/null | tr '\n' ' ')"
          echo "title: $(curl -sL https://terastockx.com/ | grep -o '<title>[^<]*</title>')"
          echo "sitemap first: $(curl -sL https://terastockx.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | head -2 | tr '\n' ' ')"
