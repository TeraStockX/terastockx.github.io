name: diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch as Googlebot
        run: |
          UA='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          for u in "" sitemap.xml robots.txt c/AAPL/; do
            echo "== /$u"
            curl -s -A "$UA" -o body.txt -D headers.txt "https://terastockx.github.io/$u"
            grep -iE '^HTTP|content-type|content-length|last-modified|x-robots' headers.txt
          done
          curl -s -A "$UA" -o sm.xml https://terastockx.github.io/sitemap.xml
          head -c 200 sm.xml; echo
          python3 -c 'import xml.etree.ElementTree as E; r=E.parse("sm.xml").getroot(); print("parsed OK urls", len(r), "first lastmod", r[0][1].text)'
          file sm.xml; head -c 3 sm.xml | od -c | head -1
