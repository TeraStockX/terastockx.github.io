name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - name: Webmail address check
        run: |
          mkdir -p out
          {
          for u in https://webmail.s23.wpx.net/ https://s23.wpx.net/ https://webmail.terastockx.com/; do
            echo "$u -> $(curl -s -o /tmp/p.html -m 20 -w '%{http_code} %{redirect_url}' "$u" 2>&1) title: $(grep -o '<title>[^<]*</title>' /tmp/p.html 2>/dev/null | head -1)"
          done
          echo "MX: $(dig +short MX terastockx.com | tr '\n' ' ')"
          echo "mail A: $(dig +short mail.terastockx.com | tr '\n' ' ')"
          echo "s23 A: $(dig +short s23.wpx.net | tr '\n' ' ') webmail.s23 A: $(dig +short webmail.s23.wpx.net | tr '\n' ' ')"
          } 2>&1 | tee out/webmail.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: webmail results" && git push -q origin HEAD:diag
