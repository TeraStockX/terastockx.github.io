name: diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          for u in sitemap.xml robots.txt c/AAPL/; do
            echo "== /$u"; curl -s -A "$UA" -o /tmp/b -D - "https://terastockx.github.io/$u" | grep -iE "^HTTP|content-type|content-length|cache-control|location"; echo "bytes: $(wc -c < /tmp/b)"
          done
          curl -s -A "$UA" https://terastockx.github.io/sitemap.xml | head -c 300; echo
          curl -s -A "$UA" https://terastockx.github.io/sitemap.xml | python3 -c "import sys,xml.etree.ElementTree as E; r=E.fromstring(sys.stdin.buffer.read()); print('parsed OK, urls:', len(r))"
