name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
  actions: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Live news final
        run: |
          mkdir -p out
          : > out/tg2.txt
          npm install --no-save --no-audit --no-fund playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node newscheck.cjs >> out/tg2.txt 2>&1 || echo "newscheck failed" >> out/tg2.txt
          cat out/tg2.txt
      - name: Save results to the diag branch
        if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add out && git commit -qm "diag: live news final" && git push -q origin HEAD:diag
