# Deploys the AI helper's Cloudflare Worker (worker/) when it changes, or by hand (Actions → Run workflow).
# Needs three repository secrets (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY. Without them the run only notes that the helper is not set up.
# The Claude API key goes from the GitHub secret straight into the Worker's secret store; it is never in the code.
name: AI-segéd (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/ai-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Beállítások ellenőrzése
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$AI_KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::The AI helper is not set up yet (see worker/README.md): nothing to deploy."; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Függőségek
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Telepítés a Cloudflare-re
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.158.0"
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
